<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Configuration</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: monospace; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #1a1a1a; color: #e0e0e0; }
        h1 { color: #4fc3f7; margin-bottom: 4px; }
        h2 { color: #90caf9; font-size: 1em; margin: 24px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
        .card { background: #2a2a2a; padding: 16px; border-radius: 6px; margin-bottom: 16px; }
        .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #333; }
        .row:last-child { border-bottom: none; }
        .label { color: #888; }
        .value { color: #fff; font-weight: bold; }
        .connected { color: #66bb6a; }
        .disconnected { color: #ef5350; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #888; font-weight: normal; padding: 6px 8px; border-bottom: 1px solid #444; font-size: 0.9em; }
        td { padding: 7px 8px; border-bottom: 1px solid #2f2f2f; }
        tr:last-child td { border-bottom: none; }
        tr.clickable:hover td { background: #333; cursor: pointer; }
        .signal-bar { display: inline-block; width: 44px; background: #444; border-radius: 3px; height: 8px; vertical-align: middle; margin-right: 4px; }
        .signal-fill { height: 100%; border-radius: 3px; background: #66bb6a; }
        .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.78em; background: #37474f; color: #90caf9; margin-left: 6px; vertical-align: middle; }
        .badge-saved { background: #1b5e20; color: #a5d6a7; }
        button { background: #1565c0; color: #fff; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 0.95em; }
        button:hover { background: #1976d2; }
        button:disabled { background: #444; color: #888; cursor: default; }
        button.danger { background: #7f1d1d; color: #fca5a5; }
        button.danger:hover { background: #991b1b; }
        button.secondary { background: #374151; }
        button.secondary:hover { background: #4b5563; }
        #scan-btn { margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; color: #888; margin-bottom: 4px; font-size: 0.9em; }
        .form-group input { width: 100%; background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 8px 10px; border-radius: 4px; font-family: monospace; font-size: 0.95em; }
        .form-group input:focus { outline: none; border-color: #4fc3f7; }
        .form-row { display: flex; gap: 8px; align-items: flex-end; }
        .form-row .form-group { flex: 1; margin-bottom: 0; }
        #msg { padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; display: none; font-size: 0.95em; }
        #msg.ok { background: #14532d; color: #86efac; display: block; }
        #msg.err { background: #7f1d1d; color: #fca5a5; display: block; }
        .connect-form { border-top: 1px solid #333; margin-top: 14px; padding-top: 14px; }
        .connect-form h3 { color: #90caf9; font-size: 0.95em; margin: 0 0 12px; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
        .dot-green { background: #66bb6a; }
        .dot-red { background: #ef5350; }
        .dot-grey { background: #666; }
        small { color: #666; font-size: 0.82em; }
    </style>
</head>
<body>
    <h1>Wi-Fi Configuration</h1>
    <small>HOSTNAME_PLACEHOLDER · wlan0</small>

    <div id="msg"></div>

    <h2>Current Status</h2>
    <div class="card" id="status-card">Loading…</div>

    <h2>Nearby Networks</h2>
    <div class="card">
        <button id="scan-btn" onclick="doScan()">Scan for networks</button>
        <div id="scan-results"></div>

        <div class="connect-form" id="connect-form" style="display:none">
            <h3 id="connect-title">Connect to network</h3>
            <div class="form-group">
                <label>SSID</label>
                <input type="text" id="ssid-input" maxlength="32" autocomplete="off" />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password <small>(leave blank for open networks)</small></label>
                    <input type="password" id="psk-input" maxlength="63" autocomplete="new-password" />
                </div>
                <button id="connect-btn" onclick="doConnect()" style="margin-bottom:0">Apply</button>
                <button class="secondary" onclick="hideForm()" style="margin-bottom:0">Cancel</button>
            </div>
        </div>
    </div>

    <h2>Saved Connections</h2>
    <div class="card" id="saved-card">Loading…</div>

    <script>
        let savedSSIDs = new Set();
        let savedConns = [];

        // ── Status ─────────────────────────────────────────────────────────

        async function loadStatus() {
            const el = document.getElementById('status-card');
            try {
                const r = await fetch('/api/status');
                const d = await r.json();
                if (d.error) {
                    el.innerHTML = '<span class="disconnected">Error: ' + d.error + '</span>';
                    return;
                }
                const connected = d.state_code === 100;
                const dot = connected ? 'dot-green' : (d.state_code === 120 ? 'dot-red' : 'dot-grey');
                el.innerHTML = `
                    <div class="row"><span class="label">State</span><span class="value"><span class="status-dot ${dot}"></span>${d.state}</span></div>
                    <div class="row"><span class="label">SSID</span><span class="value">${d.ssid || '—'}</span></div>
                    <div class="row"><span class="label">Signal</span><span class="value">${d.signal !== null ? d.signal + '%' : '—'}</span></div>
                    <div class="row"><span class="label">Frequency</span><span class="value">${d.frequency ? (d.frequency / 1000).toFixed(1) + ' GHz' : '—'}</span></div>
                    <div class="row"><span class="label">IP Address</span><span class="value">${d.ip || '—'}</span></div>
                `;
            } catch(e) {
                el.innerHTML = '<span class="disconnected">Failed to fetch status.</span>';
            }
        }

        // ── Saved connections ───────────────────────────────────────────────

        async function loadSaved() {
            const el = document.getElementById('saved-card');
            try {
                const r = await fetch('/api/connections');
                savedConns = await r.json();
                savedSSIDs = new Set(savedConns.map(c => c.ssid));
                if (!savedConns.length) {
                    el.innerHTML = '<span class="label">No saved Wi-Fi connections.</span>';
                    return;
                }
                renderSaved();
            } catch(e) {
                el.innerHTML = '<span class="disconnected">Failed to fetch connections.</span>';
            }
        }

        function renderSaved() {
            const el = document.getElementById('saved-card');
            let h = '<table><thead><tr><th>Name</th><th>SSID</th><th></th></tr></thead><tbody>';
            for (const c of savedConns) {
                h += `<tr>
                    <td>${c.id}</td>
                    <td>${c.ssid}</td>
                    <td style="text-align:right">
                        <button class="danger" onclick="doDelete('${c.uuid}', '${c.ssid}')">Remove</button>
                    </td>
                </tr>`;
            }
            h += '</tbody></table>';
            h += '<p style="margin-top:12px;margin-bottom:0"><button onclick="showForm(\'\', \'Add new network\')">+ Add network manually</button></p>';
            el.innerHTML = h;
        }

        // ── Scan ────────────────────────────────────────────────────────────

        async function doScan() {
            const btn = document.getElementById('scan-btn');
            const el = document.getElementById('scan-results');
            btn.disabled = true;
            btn.textContent = 'Scanning… (3–5 seconds)';
            el.innerHTML = '';
            try {
                const r = await fetch('/api/scan');
                const aps = await r.json();
                await loadSaved();
                if (!aps.length) {
                    el.innerHTML = '<p class="label" style="margin:12px 0 0">No networks found.</p>';
                } else {
                    let h = '<table style="margin-top:12px"><thead><tr><th>SSID</th><th>Signal</th><th>Band</th><th>Security</th><th></th></tr></thead><tbody>';
                    for (const ap of aps) {
                        const saved = savedSSIDs.has(ap.ssid) ? '<span class="badge badge-saved">saved</span>' : '';
                        const btnLabel = savedSSIDs.has(ap.ssid) ? 'Update' : 'Connect';
                        h += `<tr class="clickable">
                            <td>${ap.ssid}${saved}</td>
                            <td>
                                <span class="signal-bar"><span class="signal-fill" style="width:${ap.signal}%"></span></span>
                                ${ap.signal}%
                            </td>
                            <td>${ap.band}</td>
                            <td>${ap.security}</td>
                            <td><button onclick="showForm('${ap.ssid.replace(/'/g,"\\'")}', '${btnLabel}: ${ap.ssid.replace(/'/g,"\\'")}')">
                                ${btnLabel}
                            </button></td>
                        </tr>`;
                    }
                    h += '</tbody></table>';
                    el.innerHTML = h;
                }
            } catch(e) {
                el.innerHTML = '<p class="disconnected" style="margin:12px 0 0">Scan failed.</p>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Scan again';
            }
        }

        // ── Connect form ────────────────────────────────────────────────────

        function showForm(ssid, title) {
            document.getElementById('connect-form').style.display = 'block';
            document.getElementById('connect-title').textContent = title || 'Connect to network';
            document.getElementById('ssid-input').value = ssid || '';
            document.getElementById('psk-input').value = '';
            document.getElementById('psk-input').focus();
            document.getElementById('connect-form').scrollIntoView({ behavior: 'smooth' });
        }

        function hideForm() {
            document.getElementById('connect-form').style.display = 'none';
            document.getElementById('ssid-input').value = '';
            document.getElementById('psk-input').value = '';
        }

        async function doConnect() {
            const ssid = document.getElementById('ssid-input').value.trim();
            const psk = document.getElementById('psk-input').value;
            const btn = document.getElementById('connect-btn');

            if (!ssid) { showMsg('SSID cannot be empty.', true); return; }
            if (psk && (psk.length < 8 || psk.length > 63)) {
                showMsg('Password must be 8–63 characters.', true); return;
            }

            btn.disabled = true;
            btn.textContent = 'Applying… (up to 30s)';
            showMsg('Connecting to ' + ssid + '… please wait.', false);

            try {
                const r = await fetch('/api/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ssid, passphrase: psk }),
                });
                const d = await r.json();
                showMsg(d.message, !d.success);
                if (d.success) {
                    hideForm();
                    await loadStatus();
                    await loadSaved();
                }
            } catch(e) {
                showMsg('Request failed — check the Pi is reachable.', true);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Apply';
            }
        }

        // ── Delete ──────────────────────────────────────────────────────────

        async function doDelete(uuid, ssid) {
            if (!confirm('Remove saved connection for "' + ssid + '"?\n\nThis cannot be undone.')) return;
            try {
                const r = await fetch('/api/connections/' + uuid, { method: 'DELETE' });
                const d = await r.json();
                showMsg(d.message, !d.success);
                if (d.success) {
                    await loadSaved();
                }
            } catch(e) {
                showMsg('Delete failed.', true);
            }
        }

        // ── Helpers ─────────────────────────────────────────────────────────

        function showMsg(text, isError) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = isError ? 'err' : 'ok';
            if (!isError) {
                setTimeout(() => { el.className = ''; el.textContent = ''; el.style.display = 'none'; }, 8000);
            }
        }

        // ── Init ────────────────────────────────────────────────────────────
        loadStatus();
        loadSaved();
    </script>
</body>
</html>
